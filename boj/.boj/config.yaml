general:
  selenium_browser: firefox
  default_filetype: cpp
  editor_command: nvim -o
  submit_command:
    linux: firefox $url
    darwin: open $url
workspace:
  ongoing_dir: problems
  archive_dir: solved
filetype:
  cpp:
    language: "c++17"
    main: main.cpp
    source_templates: 
      - main.cpp
    root_templates:
      - compile_flags.txt
      - .clangd
    compile: g++ -std=c++20 -O2 -Wall -Wno-sign-compare $file -o a.out
    run: "./a.out"
    after: rm -rf a.out
  py:
    language: "python3"
    main: main.py
    source_templates: 
      - main.py
    run: "python3 $file"
